<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keshin2D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23b9a3f0%22/%3E%3Ccircle cx=%2211%22 cy=%2215%22 r=%222.5%22 fill=%22%23333%22/%3E%3Ccircle cx=%2221%22 cy=%2215%22 r=%222.5%22 fill=%22%23333%22/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 13px/1.5 "Segoe UI", "Yu Gothic UI", sans-serif; color: #e8e8ea; }
  body.bg-transparent { background: transparent; }
  body.bg-green { background: #00ff00; }
  body.bg-white { background: #ffffff; }
  body.bg-dark { background: #23242b; }
  body.bg-room { background: linear-gradient(#cfe3f5, #f6efe6); }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: absolute; top: 8px; left: 8px; width: 290px; max-height: calc(100% - 16px); overflow: auto;
        background: rgba(24, 25, 30, .92); border: 1px solid #3a3c46; border-radius: 8px; padding: 10px 12px; box-sizing: border-box; }
  #ui h2 { font-size: 12px; margin: 12px 0 4px; color: #9aa0b0; font-weight: 600; }
  #ui h2:first-child { margin-top: 0; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button, select { font: inherit; color: inherit; background: #2c2e38; border: 1px solid #474a58; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button.on { background: #3b6fe0; border-color: #3b6fe0; }
  label.sl { display: grid; grid-template-columns: 104px 1fr 40px; gap: 6px; align-items: center; }
  label.sl span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: #9aa0b0; }
  input[type=range] { width: 100%; }
  #status { color: #9aa0b0; margin-top: 6px; min-height: 1.5em; }
  .hint { color: #9aa0b0; margin-top: 4px; }
  #ui h2.group { margin-top: 14px; padding-top: 8px; border-top: 1px solid #3a3c46; }
  .sec { border: 1px solid #3a3c46; border-radius: 6px; margin-top: 6px; background: rgba(44, 46, 56, .35); }
  .sec > .sechead { display: block; width: 100%; text-align: left; border: 0; border-radius: 6px; background: transparent; padding: 6px 10px; font-weight: 600; color: #cfd3e0; }
  .sec > .sechead::before { content: "▸ "; color: #9aa0b0; }
  .sec.open > .sechead { border-bottom: 1px solid #3a3c46; border-radius: 6px 6px 0 0; color: #fff; }
  .sec.open > .sechead::before { content: "▾ "; }
  .sec > .secbody { display: none; padding: 8px 10px 10px; }
  .sec.open > .secbody { display: block; }
  #cam { position: absolute; right: 8px; bottom: 8px; width: 200px; border-radius: 6px; transform: scaleX(-1); display: none; }
  body.noui #ui, body.noui #cam { display: none !important; }
</style>
</head>
<body class="bg-room">
<canvas id="view"></canvas>
<video id="cam" playsinline muted></video>
<div id="ui">
  <h2>動かし方</h2>
  <div class="row" id="modes">
    <button data-mode="mouse">マウス</button>
    <button data-mode="demo">デモ</button>
    <button data-mode="camera">Webカメラ</button>
    <button data-mode="manual">手動</button>
  </div>
  <div class="row" style="margin-top:6px">
    <label><input type="checkbox" id="mic"> マイクで口パク</label>
    <label><input type="checkbox" id="mirror" checked> 鏡写し</label>
    <label><input type="checkbox" id="hair"> 髪を表示</label>
  </div>
  <div id="status"></div>
  <h2>口のデモ（音なし）</h2>
  <div class="row" id="demos"></div>
  <h2>表情</h2>
  <div class="row" id="exprs"></div>
  <h2>背景と配置</h2>
  <div class="row">
    <select id="bg">
      <option value="room">明るい色</option>
      <option value="dark">暗い色</option>
      <option value="white">白</option>
      <option value="green">緑（クロマキー）</option>
      <option value="transparent">透過（OBS ブラウザソース用）</option>
    </select>
    <button id="hide" title="H キーでも切り替え">パネルを隠す (H)</button>
  </div>
  <div class="hint">配置: 画面をドラッグで位置、ホイールで大きさ。</div>
  <h2 class="group">細かい調整（押すと開きます）</h2>
  <div class="sec" data-sec="manual"><button class="sechead">手で動かす（表情・向き・口）</button><div class="secbody" id="sliders"></div></div>
  <div class="sec" data-sec="tune"><button class="sechead">向きの上限・髪の揺れ</button><div class="secbody" id="tune"></div></div>
  <div id="sections"></div>
</div>
<!-- エンジンの js は、開くたびに新しい版を取りに行く（?v= に今の時刻。avatar.js は、同じ印を、あとから読み込む js にも付ける）。
     印が無いと、ブラウザが前の版をしまったまま使い、直したエンジンが効かないことがある -->
<script type="module">import('./js/avatar.js?v=' + Date.now());</script>
</body>
</html>
